[project]
name = "chronos-tradingview"
version = "0.1.0"
description = "Chronos-2 forecasting API that receives TradingView webhook candle data"
readme = "guide.md"
requires-python = ">=3.13"
dependencies = [
    # Inference stack
    "chronos-forecasting==2.3.2",
    "torch==2.14.1",
    # Data / API layer
    "pandas==3.0.6",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    # Model download + env loading
    "huggingface-hub==2.2.0",
    "python-dotenv==1.2.4",
]

[tool.uv]
# Flat script project (model_api.py / download_model.py) — nothing to build.
package = false
